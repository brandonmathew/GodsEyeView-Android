<?xml version="1.0" encoding="UTF-8"?>
<!-- God's Eye View Android v2 launcher icon — source artwork.
     Techy eye: angular HUD eye outline, globe iris, reticle ticks.
     Canvas 108x108 (adaptive-icon grid). Identity: bg #0A0A0F,
     accent #00D4FF, light #E8EAED. The Android vector drawables in
     res/drawable and the PNG fallbacks are generated from these
     exact coordinates. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 108">
  <rect width="108" height="108" fill="#0A0A0F"/>
  <g fill="none" stroke="#00D4FF" stroke-width="4.0">
    <line x1="54" y1="9" x2="54" y2="16"/>
    <line x1="54" y1="92" x2="54" y2="99"/>
    <line x1="9" y1="54" x2="16" y2="54"/>
    <line x1="92" y1="54" x2="99" y2="54"/>
  </g>
  <polygon points="22,54 42,36 66,36 86,54 66,72 42,72" fill="#00D4FF" fill-opacity="0.08"
           stroke="#00D4FF" stroke-width="5.0" stroke-linejoin="miter"/>
  <g fill="none" stroke="#E8EAED">
    <circle cx="54" cy="54" r="14.5" stroke-width="2.8"/>
    <ellipse cx="54" cy="54" rx="6.0" ry="14.5" stroke-width="2.2"/>
    <ellipse cx="54" cy="54" rx="14.5" ry="5.5" stroke-width="2.2"/>
  </g>
  <circle cx="54" cy="54" r="4.2" fill="#00D4FF"/>
</svg>
