org.gradle.jvmargs=-Xmx1536m
# Retry failed repository requests (e.g. transient HTTP 429) instead of
# failing the whole resolution on the first error. Refs #8.
systemProp.org.gradle.internal.repository.max.retries=5
systemProp.org.gradle.internal.repository.initial.backoff=1000
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
