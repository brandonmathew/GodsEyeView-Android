name: Beta release

# Every push to beta publishes a prerelease named after the target stable
# (plan Q38): with no stable tag yet the target is 1.0.0, so betas are
# 1.0.0-beta.1, 1.0.0-beta.2, ... The version is assigned here, never on
# feature branches.
on:
  push:
    branches: [beta]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  beta:
    runs-on: ubuntu-latest
    steps:
      # Never build before CI passes. A workflow_run trigger cannot do
      # this job here: GitHub only fires workflow_run from the workflow
      # file on the default branch, and this file lives on beta (Refs #8).
      # So the gate is the first step instead: wait for the CI run for
      # this exact commit and refuse to build unless it succeeded.
      - name: Gate — require CI success for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHA="$GITHUB_SHA"
          echo "Waiting for CI result for commit $SHA..."
          for i in $(seq 1 30); do
            RUN_JSON=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow CI --limit 20 \
              --json headSha,status,conclusion \
              --jq "[.[] | select(.headSha == \"$SHA\")] | first // empty")
            if [ -n "$RUN_JSON" ]; then
              STATUS=$(echo "$RUN_JSON" | jq -r .status)
              CONCLUSION=$(echo "$RUN_JSON" | jq -r .conclusion)
              echo "CI run: status=$STATUS conclusion=$CONCLUSION"
              if [ "$STATUS" = "completed" ]; then
                if [ "$CONCLUSION" = "success" ]; then
                  echo "CI passed for $SHA. Proceeding to build."
                  exit 0
                fi
                echo "CI did not pass for $SHA (conclusion=$CONCLUSION). Refusing to build."
                exit 1
              fi
            else
              echo "No CI run for $SHA yet."
            fi
            sleep 30
          done
          echo "Timed out waiting for CI for $SHA. Refusing to build."
          exit 1

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compute beta version
        id: version
        run: |
          LATEST_STABLE=$(git tag --list 'v[0-9]*' --sort=-v:refname | grep -v -- '-' | head -n 1 || true)
          if [ -z "$LATEST_STABLE" ]; then
            TARGET="1.0.0"
          else
            MAJOR="${LATEST_STABLE#v}"
            MAJOR="${MAJOR%%.*}"
            TARGET="$((MAJOR + 1)).0.0"
          fi
          N=$(git tag --list "v${TARGET}-beta.*" | wc -l)
          N=$((N + 1))
          echo "version=${TARGET}-beta.${N}" >> "$GITHUB_OUTPUT"
          echo "tag=v${TARGET}-beta.${N}" >> "$GITHUB_OUTPUT"
          echo "Beta version: ${TARGET}-beta.${N} (target stable $TARGET)"

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.p12"
          echo "GEV_KEYSTORE_FILE=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"

      - name: Build signed beta APK
        env:
          GEV_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          GEV_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          GEV_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          GEV_VERSION_NAME: ${{ steps.version.outputs.version }}
        run: |
          export GEV_VERSION_CODE="$(git rev-list --count HEAD)"
          for attempt in 1 2 3; do
            if ./gradlew :layer-api:test :app:assembleRelease --console=plain; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Attempt $attempt failed; retrying in 60s..."
              sleep 60
            fi
          done
          exit 1

      - name: Publish beta prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          cp app/build/outputs/apk/release/app-release.apk "GodsEyeView-$VERSION.apk"
          sha256sum "GodsEyeView-$VERSION.apk" > "GodsEyeView-$VERSION.apk.sha256"
          gh release create "${{ steps.version.outputs.tag }}" \
            "GodsEyeView-$VERSION.apk" "GodsEyeView-$VERSION.apk.sha256" \
            --title "God's Eye View Android $VERSION" \
            --generate-notes --prerelease \
            --target "$GITHUB_SHA"
