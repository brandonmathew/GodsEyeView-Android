name: CI

on:
  pull_request:
    branches: [beta, main]
  push:
    branches: [beta]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests and debug build
        # Up to 3 attempts: a transient repository error (e.g. HTTP 429
        # from a Maven host) must not fail CI by itself. A real test or
        # compile failure fails all 3 attempts and still fails the run.
        run: |
          for attempt in 1 2 3; do
            if ./gradlew :layer-api:test :core-globe:testDebugUnitTest :core-ui:testDebugUnitTest :app:testDebugUnitTest :app:assembleDebug --console=plain; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Attempt $attempt failed; retrying in 60s..."
              sleep 60
            fi
          done
          exit 1

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: gods-eye-view-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
