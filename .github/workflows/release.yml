name: Release

# Stable releases: tag vX.Y.Z on main (plan Q22/Q38).
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.p12"
          echo "GEV_KEYSTORE_FILE=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"

      - name: Build signed release APK
        env:
          GEV_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          GEV_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          GEV_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          export GEV_VERSION_NAME="${GITHUB_REF_NAME#v}"
          export GEV_VERSION_CODE="$(git rev-list --count HEAD)"
          for attempt in 1 2 3; do
            if ./gradlew :layer-api:test :app:assembleRelease --console=plain; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Attempt $attempt failed; retrying in 60s..."
              sleep 60
            fi
          done
          exit 1

      - name: Package release assets
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          cp app/build/outputs/apk/release/app-release.apk "GodsEyeView-$VERSION.apk"
          sha256sum "GodsEyeView-$VERSION.apk" > "GodsEyeView-$VERSION.apk.sha256"
          ls -la GodsEyeView-*

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          PRERELEASE_FLAG=""
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then PRERELEASE_FLAG="--prerelease"; fi
          gh release create "$GITHUB_REF_NAME" \
            "GodsEyeView-$VERSION.apk" "GodsEyeView-$VERSION.apk.sha256" \
            --title "God's Eye View Android $VERSION" \
            --generate-notes $PRERELEASE_FLAG
